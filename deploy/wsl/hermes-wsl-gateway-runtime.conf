[Service]
# The gateway launches workers, so it must pass the native Linux checkout
# through to its children as well as using it for its own imports.
Environment=PYTHONPATH=/mnt/d/Hermes/hermes-agent/.fabric-current
Environment=HERMES_HOME=/mnt/d/Hermes/home
Environment=HERMES_BIN=/mnt/d/Hermes/hermes-agent/venv/bin/hermes
# The legacy /usr/local/bin/hermes wrapper clears PYTHONPATH. Invoke the
# installed entry point directly so children inherit the pinned code path.
ExecStart=
ExecStart=/mnt/d/Hermes/hermes-agent/venv/bin/hermes gateway run --accept-hooks --external-supervisor
