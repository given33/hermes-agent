name: Deploy three Hermes endpoints

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - diagnose-fabric

permissions:
  contents: read
  actions: read

concurrency:
  group: hermes-three-endpoint-production
  cancel-in-progress: false

jobs:
  diagnose-fabric:
    name: Diagnose fabric updater without deployment
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose-fabric'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure pinned deployment SSH identity
        env:
          DEPLOY_KEY_B64: ${{ secrets.HERMES_PUBLIC_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.HERMES_PUBLIC_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY_B64"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode >"$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/id_ed25519" >/dev/null
      - name: Read the DBB3 fabric updater state
        env:
          REMOTE: ${{ secrets.HERMES_PUBLIC_USER }}@${{ secrets.HERMES_PUBLIC_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes "$REMOTE" \
            'sudo -n /bin/bash -s' <<'PUBLIC'
          set -euo pipefail
          options=(
            -o BatchMode=yes
            -o ConnectTimeout=6
            -o LogLevel=ERROR
            -o StrictHostKeyChecking=yes
          )
          for target in dbb3-hermes root@10.66.0.2 hermes@10.66.0.2; do
            if ssh "${options[@]}" "$target" true 2>/dev/null; then
              printf 'diagnostic_target=%s\n' "$target"
              ssh "${options[@]}" "$target" 'sudo -n /bin/bash -s' <<'NODE'
          set -euo pipefail
          systemctl show hermes-fabric-update.timer \
            --property=LoadState,ActiveState,SubState,UnitFileState,LastTriggerUSec,NextElapseUSecRealtime
          systemctl show hermes-fabric-update.service \
            --property=LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,StateChangeTimestamp
          systemctl list-timers hermes-fabric-update.timer --all --no-pager
          journalctl -u hermes-fabric-update.service -n 160 --no-pager -o short-iso
          NODE
              exit 0
            fi
          done
          printf '%s\n' 'No pinned, non-interactive DBB3 SSH route is configured on the public authority.' >&2
          exit 1
          PUBLIC

  verify:
    name: Verify production backend release
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Wait for the complete CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$RELEASE_COMMIT" \
              --limit 1 \
              --json status,conclusion,headSha)"
            if [ "$(printf '%s' "$run_json" | jq 'length')" -gt 0 ]; then
              status="$(printf '%s' "$run_json" | jq -r '.[0].status')"
              conclusion="$(printf '%s' "$run_json" | jq -r '.[0].conclusion // empty')"
              case "$status" in
                completed)
                  if [ "$conclusion" = success ]; then
                    echo "Complete CI gate passed for $RELEASE_COMMIT"
                    break
                  fi
                  echo "::error::Complete CI gate ended with conclusion '$conclusion' for $RELEASE_COMMIT"
                  exit 1
                  ;;
              esac
              echo "CI gate is $status for $RELEASE_COMMIT; waiting"
            else
              echo "CI gate for $RELEASE_COMMIT has not been created; waiting"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for the complete CI gate for $RELEASE_COMMIT"
              exit 1
            fi
            sleep 10
          done
      - name: Install the locked backend environment
        # The release boundary exercises the Hindsight plugin explicitly.
        # `[all]` intentionally excludes lazy-install feature SDKs, while CI
        # disables runtime installs, so install this one tested extra up front.
        run: uv sync --locked --python 3.11 --extra all --extra dev --extra hindsight
      - name: Verify deployable backend boundaries
        run: |
          uv run ruff check \
            agent gateway hermes_cli hermes_services plugins tools utils.py
          scripts/run_tests.sh \
            tests/deploy/test_cloud_deployment_assets.py \
            tests/hermes_cli/test_config_read_guard.py \
            tests/hermes_services/test_tool_contract.py \
            tests/hermes_services/test_internal_hooks.py \
            tests/hermes_services/test_official_frontend_event_protocol.py \
            tests/run_agent/test_tool_batch_segmentation.py \
            tests/hermes_cli/test_account_cleanup.py \
            tests/hermes_cli/test_ios_intelligence.py \
            tests/hermes_cli/test_plugin_cli_registration.py \
            tests/gateway/test_hooks.py \
            tests/gateway/test_weixin.py::TestWeixinStatePersistence \
            tests/plugins/memory/test_hindsight_provider.py \
            tests/plugins/test_collaboration_ios_contract.py \
            tests/test_sqlite_wal_reset_gate.py \
            tests/tools/test_windows_compat.py

  deploy-public:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure pinned deployment SSH identity
        env:
          DEPLOY_KEY_B64: ${{ secrets.HERMES_PUBLIC_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.HERMES_PUBLIC_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY_B64"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode >"$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/id_ed25519" >/dev/null
      - name: Deploy the public authority transactionally
        env:
          HERMES_PUBLIC_REMOTE: ${{ secrets.HERMES_PUBLIC_USER }}@${{ secrets.HERMES_PUBLIC_HOST }}
          HERMES_SSH_IDENTITY: ${{ runner.temp }}/ssh/id_ed25519
          HERMES_SSH_KNOWN_HOSTS: ${{ runner.temp }}/ssh/known_hosts
          HERMES_REQUIRE_PINNED_SSH_HOST_KEY: '1'
          HERMES_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          bash deploy/public/deploy-collaboration-backend.sh
      - name: Verify the public and fabric release evidence
        env:
          REMOTE: ${{ secrets.HERMES_PUBLIC_USER }}@${{ secrets.HERMES_PUBLIC_HOST }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          EXPECTED_VERSION="$(python3 -c 'import json; print(json.load(open("plugins/collaboration/dashboard/manifest.json"))["version"])')"
          evidence="$(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes "$REMOTE" \
            'sudo -n cat /var/lib/hermes-agent-release/release-evidence.json')"
          EXPECTED_VERSION="$EXPECTED_VERSION" python3 -c 'import json,os,sys; d=json.load(sys.stdin); assert d["phase"]=="committed"; assert d["commit"]==os.environ["EXPECTED_COMMIT"]; assert d["version"]==os.environ["EXPECTED_VERSION"]; assert d["fabric"]["status"]=="verified"; assert all(v=={"commit":d["commit"],"version":d["version"]} for v in d["fabric"]["nodes"].values())' <<<"$evidence"
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes "$REMOTE" \
            "sudo -n /bin/bash -s -- '$EXPECTED_COMMIT' '$EXPECTED_VERSION'" \
            < deploy/public/verify-fabric-release.sh

  dispatch-ios:
    name: Build iOS app after backend release
    needs: deploy-public
    # Scheduled runs heal backend drift but must not enqueue an iOS build every
    # two hours. Pushes and explicit manual runs represent source changes or an
    # intentional replay and therefore fan out to the iOS repository.
    if: needs.deploy-public.result == 'success' && (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dispatch and observe the iOS build
        env:
          GH_TOKEN: ${{ secrets.HERMES_IOS_WORKFLOW_TOKEN }}
          IOS_REPOSITORY: ${{ vars.HERMES_IOS_REPOSITORY || 'given33/hermes-ios' }}
          HERMES_IOS_SIGNED_BUILD: ${{ vars.HERMES_IOS_SIGNED_BUILD || '0' }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}" || {
            echo "::error::HERMES_IOS_WORKFLOW_TOKEN is required to synchronize the iOS repository"
            exit 1
          }
          case "${HERMES_IOS_SIGNED_BUILD}" in
            0|1) ;;
            *)
              echo "::error::HERMES_IOS_SIGNED_BUILD must be 0 or 1"
              exit 1
              ;;
          esac
          release_version="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('plugins/collaboration/dashboard/manifest.json').read_text(encoding='utf-8'))['version'])
          PY
          )"
          [[ "${release_version}" =~ ^[0-9A-Za-z.+_-]+$ ]] || {
            echo "::error::Dashboard release version contains unsupported characters: ${release_version}"
            exit 1
          }
          release_name="Backend release ${RELEASE_COMMIT}"
          production_release_name="Backend release signed ${RELEASE_COMMIT}"
          run_list() {
            local workflow="$1"
            local output=""
            for attempt in 1 2 3; do
              if output="$(gh run list \
                --repo "${IOS_REPOSITORY}" \
                --workflow "${workflow}" \
                --event repository_dispatch \
                --limit 50 \
                --json databaseId,displayTitle,status,conclusion)"; then
                printf '%s' "${output}"
                return 0
              fi
              echo "::warning::GitHub Actions API run-list attempt ${attempt}/3 failed for ${workflow}" >&2
              [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }
          find_release_run() {
            local workflow="$1"
            local run_name="$2"
            run_list "${workflow}" \
              | jq -r --arg name "${run_name}" \
                'map(select(.displayTitle == $name and (.status == "queued" or .status == "in_progress" or (.status == "completed" and .conclusion == "success")))) | sort_by(.databaseId) | reverse | .[0].databaseId // empty'
          }
          find_failed_release_run() {
            local workflow="$1"
            local run_name="$2"
            run_list "${workflow}" \
              | jq -r --arg name "${run_name}" \
                'map(select(.displayTitle == $name and .status == "completed" and .conclusion != "success")) | sort_by(.databaseId) | reverse | .[0].databaseId // empty'
          }
          dispatch_release() {
            local event_type="$1"
            local payload
            payload="$(jq -n \
              --arg event_type "${event_type}" \
              --arg commit "${RELEASE_COMMIT}" \
              --arg version "${release_version}" \
              '{event_type: $event_type, client_payload: {commit: $commit, version: $version}}')"
            for attempt in 1 2 3; do
              if printf '%s' "${payload}" | gh api --method POST "repos/${IOS_REPOSITORY}/dispatches" --input -; then
                echo "Dispatched backend release ${RELEASE_COMMIT} (${release_version}) to ${IOS_REPOSITORY}"
                return 0
              fi
              echo "::warning::GitHub repository-dispatch attempt ${attempt}/3 failed" >&2
              [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }
          rerun_release() {
            local run_id="$1"
            for attempt in 1 2 3; do
              if gh run rerun "${run_id}" --repo "${IOS_REPOSITORY}"; then
                return 0
              fi
              echo "::warning::GitHub Actions rerun attempt ${attempt}/3 failed for ${run_id}" >&2
              [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }
          watch_release() {
            local run_id="$1"
            local workflow_label="$2"
            local state=""
            for attempt in 1 2 3; do
              if gh run watch "${run_id}" --repo "${IOS_REPOSITORY}" --interval 15 --exit-status; then
                return 0
              fi
              state="$(gh run view "${run_id}" --repo "${IOS_REPOSITORY}" --json status,conclusion \
                --jq 'if .status == "completed" then (.conclusion // "unknown") else .status end' 2>/dev/null || true)"
              case "${state}" in
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "::error::iOS ${workflow_label} run ${run_id} ended with ${state}"
                  return 1
                  ;;
              esac
              echo "::warning::iOS ${workflow_label} watch attempt ${attempt}/3 ended with ${state:-unknown}; retrying" >&2
              [ "${attempt}" -lt 3 ] && sleep $((attempt * 10))
            done
            gh run view "${run_id}" --repo "${IOS_REPOSITORY}" \
              --json databaseId,status,conclusion,headSha,url
            return 1
          }

          # The normal mobile delivery contract is an unsigned IPA that the
          # operator signs with their own certificate tool. Keep the EAS
          # production workflow opt-in: the iOS repository has no signing
          # credentials in this deployment, and a missing optional signed
          # build must not block the usable unsigned artifact.
          if [ "${HERMES_IOS_SIGNED_BUILD}" = "0" ]; then
            run_id="$(find_release_run ios-unsigned.yml "${release_name}")"
            failed_run_id="$(find_failed_release_run ios-unsigned.yml "${release_name}")"
            if [ -z "${run_id}" ] && [ -n "${failed_run_id}" ]; then
              rerun_release "${failed_run_id}"
              run_id="${failed_run_id}"
              echo "Re-running failed iOS unsigned run ${run_id}"
            fi
            if [ -z "${run_id}" ]; then
              dispatch_release "hermes-backend-release-unsigned"
              for _ in $(seq 1 60); do
                run_id="$(find_release_run ios-unsigned.yml "${release_name}")"
                [ -n "${run_id}" ] && break
                sleep 2
              done
            fi
            test -n "${run_id}" || {
              echo "::error::iOS repository dispatch was accepted but its unsigned run could not be observed"
              exit 1
            }
            echo "Observing iOS unsigned run ${run_id}"
            watch_release "${run_id}" unsigned
            echo "Unsigned iOS IPA is the configured delivery artifact; signed EAS build is opt-in"
            exit 0
          fi

          # A repository_dispatch starts both child workflows. Reuse active or
          # successful runs while the sibling is still appearing in the API;
          # completed failures are rerun individually so one failed child does
          # not block the other child from ever being observed.
          run_id="$(find_release_run ios-unsigned.yml "${release_name}")"
          production_run_id="$(find_release_run ios-production-eas.yml "${production_release_name}")"
          failed_run_id="$(find_failed_release_run ios-unsigned.yml "${release_name}")"
          failed_production_run_id="$(find_failed_release_run ios-production-eas.yml "${production_release_name}")"
          if [ -z "${run_id}" ] && [ -n "${failed_run_id}" ]; then
            rerun_release "${failed_run_id}"
            run_id="${failed_run_id}"
            echo "Re-running failed iOS unsigned run ${run_id}"
          fi
          if [ -z "${production_run_id}" ] && [ -n "${failed_production_run_id}" ]; then
            rerun_release "${failed_production_run_id}"
            production_run_id="${failed_production_run_id}"
            echo "Re-running failed iOS production EAS run ${production_run_id}"
          fi
          if [ -z "${run_id}" ] && [ -z "${production_run_id}" ]; then
            dispatch_release "hermes-backend-release"
          elif [ -z "${run_id}" ] || [ -z "${production_run_id}" ]; then
            # A partial/old dispatch can leave only one child workflow. Give
            # the missing sibling time to appear in the Actions API first;
            # if it never does, fail closed instead of emitting a duplicate
            # repository_dispatch. The original event may already be accepted,
            # and a second event would queue duplicate unsigned/EAS builds.
            for _ in $(seq 1 60); do
              [ -n "${run_id}" ] || run_id="$(find_release_run ios-unsigned.yml "${release_name}")"
              [ -n "${production_run_id}" ] || production_run_id="$(find_release_run ios-production-eas.yml "${production_release_name}")"
              if [ -n "${run_id}" ] && [ -n "${production_run_id}" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "${run_id}" ] || [ -z "${production_run_id}" ]; then
              echo "::error::Initial iOS repository dispatch produced only a partial child set; refusing a duplicate dispatch"
              exit 1
            fi
          else
            echo "iOS release ${RELEASE_COMMIT} already has unsigned run ${run_id:-none} and production run ${production_run_id:-none}; reusing existing dispatch"
          fi
          # Poll both workflows together. This covers the normal API delay and
          # the case where one workflow is queued before the other is visible.
          for _ in $(seq 1 60); do
            [ -n "${run_id}" ] || run_id="$(find_release_run ios-unsigned.yml "${release_name}")"
            [ -n "${production_run_id}" ] || production_run_id="$(find_release_run ios-production-eas.yml "${production_release_name}")"
            if [ -n "${run_id}" ] && [ -n "${production_run_id}" ]; then
              break
            fi
            sleep 2
          done
          test -n "${run_id}" || {
            echo "::error::iOS repository dispatch was accepted but its unsigned run could not be observed"
            exit 1
          }
          test -n "${production_run_id}" || {
            echo "::error::iOS repository dispatch was accepted but its production EAS run could not be observed"
            exit 1
          }
          echo "Observing iOS unsigned run ${run_id}"
          watch_release "${run_id}" unsigned
          echo "Observing iOS production EAS run ${production_run_id}"
          watch_release "${production_run_id}" production
