name: Upstream Hermes sync

on:
  schedule:
    # 02:17 Asia/Shanghai. A non-round minute avoids the busiest scheduler edge.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional exact NousResearch/hermes-agent tag (legacy input)
        required: false
        type: string
      ref:
        description: Optional upstream main ref or exact tag; defaults to upstream/main
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-hermes-sync
  cancel-in-progress: false

jobs:
  prepare-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the complete product history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch and select the upstream revision
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --force --tags upstream \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/tags/*:refs/tags/*'
          requested="${REQUESTED_REF:-${REQUESTED_TAG:-}}"
          ref="${requested:-refs/remotes/upstream/main}"
          if [[ "$ref" =~ ^v[0-9]+([.][0-9]+)+$ ]]; then
            ref="refs/tags/$ref"
          fi
          [[ "$ref" == refs/remotes/upstream/main || "$ref" == refs/tags/v[0-9]* ]] || {
            echo "Invalid upstream ref: $ref" >&2
            exit 2
          }
          git rev-parse --verify "${ref}^{commit}" >/dev/null
          label="${ref#refs/remotes/upstream/}"
          label="${label#refs/tags/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$ref" origin/main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when main already contains the release
        if: steps.release.outputs.needed != 'true'
        run: echo "${{ steps.release.outputs.label }} is already contained in main."

      - name: Generate the pre-merge risk report
        if: steps.release.outputs.needed == 'true'
        run: |
          python3 scripts/upstream_change_report.py \
            --base origin/main \
            --tag '${{ steps.release.outputs.ref }}' \
            --output "$RUNNER_TEMP/upstream-report.md"

      - name: Check out the iOS integration snapshot
        if: steps.release.outputs.needed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: given33/hermes-ios
          ref: main
          path: .upstream-ios-audit
          persist-credentials: false

      - name: Record official backend and iOS declaration coverage
        if: steps.release.outputs.needed == 'true'
        run: |
          python3 scripts/feature_alignment_inventory.py \
            --official-ref '${{ steps.release.outputs.ref }}' \
            --ios-root .upstream-ios-audit \
            --output "$RUNNER_TEMP/feature-alignment.json"

      - name: Merge into the managed sync branch
        if: steps.release.outputs.needed == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          ref='${{ steps.release.outputs.ref }}'
          label='${{ steps.release.outputs.label }}'
          branch="upstream-sync/main"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --force-create "$branch" origin/main
          set +e
          git merge --no-ff --no-edit "$ref" >"$RUNNER_TEMP/merge.log" 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            git diff --name-only --diff-filter=U >"$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Record merge conflicts without changing main
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'true'
        shell: bash
        run: |
          set -euo pipefail
          title="Upstream sync conflict: ${{ steps.release.outputs.label }}"
          {
            cat "$RUNNER_TEMP/upstream-report.md"
            printf '\n## Merge conflicts\n\n```text\n'
            cat "$RUNNER_TEMP/conflicts.txt"
            printf '```\n'
          } >"$RUNNER_TEMP/conflict-issue.md"
          cat "$RUNNER_TEMP/conflict-issue.md" >> "$GITHUB_STEP_SUMMARY"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/conflict-issue.md" || \
              echo '::warning::Could not update the sync issue; see the run summary and artifacts.'
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/conflict-issue.md" || \
              echo '::warning::Could not create the sync issue; see the run summary and artifacts.'
          fi

      - name: Install the locked test environment
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Run product integration preflight
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        id: product
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev
          source .venv/bin/activate
          bash scripts/run_tests.sh -j 2 -q \
            tests/agent/test_side_question.py \
            tests/agent/test_system_prompt.py \
            tests/agent/test_prompt_builder.py \
            tests/gateway/test_background_command.py \
            tests/gateway/test_busy_command.py \
            tests/gateway/test_multiplex_busy_input_mode.py \
            tests/gateway/test_gateway_command_dispatch_minimal.py \
            tests/gateway/test_slash_access_dispatch.py \
            tests/gateway/relay/test_relay_slack_unfurl.py \
            tests/hermes_cli/test_commands.py \
            tests/hermes_cli/test_mobile_console.py \
            tests/hermes_cli/test_router_provider.py \
            tests/hermes_cli/test_nebius_token_factory_provider.py \
            tests/hermes_cli/test_tencent_tokenhub_provider.py \
            tests/providers/test_plugin_discovery.py \
            tests/providers/test_transport_parity.py \
            tests/tools/test_todo_nested.py \
            tests/tools/test_skill_manage_batch.py \
            tests/plugins/test_collaboration_dashboard.py \
            tests/plugins/test_collaboration_cloud_files.py \
            tests/plugins/test_collaboration_managed_resources.py \
            tests/plugins/test_hosted_events_websocket.py \
            tests/hermes_services/test_hosted_role_migration.py \
            tests/hermes_services/test_worker_channel.py \
            tests/hermes_services/test_official_frontend_event_protocol.py \
            tests/deploy/test_cloud_deployment_assets.py \
            tests/deploy/test_managed_installation_topology.py

      - name: Enforce product-owned workflow invariants after upstream merge
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upstream_sync_gate.py

      - name: Set up the iOS package manager
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1

      - name: Set up the iOS JavaScript runtime
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify the iOS snapshot before promoting the backend
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        id: mobile
        continue-on-error: true
        working-directory: .upstream-ios-audit
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/ios-tested-commit.txt"
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck

      - name: Push the verified upstream merge directly to main
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false' && steps.product.outcome == 'success' && steps.mobile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.merge.outputs.branch }}'
          label='${{ steps.release.outputs.label }}'
          git push origin "HEAD:refs/heads/main"
          echo "Verified official Hermes ${label} merge pushed from ${branch}."

      - name: Publish the verified sync branch for diagnostics
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/${{ steps.merge.outputs.branch }}"

      - name: Fail the run when the product preflight failed
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false' && (steps.product.outcome != 'success' || steps.mobile.outcome != 'success')
        run: |
          echo 'Backend or iOS integration preflight failed; main was not promoted.' >&2
          exit 1

      - name: Preserve upstream evidence even when merge or reporting fails
        if: always() && steps.release.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-sync-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/upstream-report.md
            ${{ runner.temp }}/merge.log
            ${{ runner.temp }}/conflicts.txt
            ${{ runner.temp }}/conflict-issue.md
            ${{ runner.temp }}/feature-alignment.json
            ${{ runner.temp }}/feature-alignment.md
            ${{ runner.temp }}/ios-tested-commit.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the run when upstream conflicts remain
        if: always() && steps.merge.outputs.conflict == 'true'
        run: |
          echo 'Upstream merge conflicts remain; see the run summary and artifacts. Main was not promoted.' >&2
          exit 1
