name: Upstream Hermes sync

on:
  schedule:
    # 02:17 Asia/Shanghai. A non-round minute avoids the busiest scheduler edge.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional exact NousResearch/hermes-agent tag (legacy input)
        required: false
        type: string
      ref:
        description: Optional upstream main ref or exact tag; defaults to upstream/main
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-hermes-sync
  cancel-in-progress: false

jobs:
  prepare-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the complete product history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch and select the upstream revision
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --force --tags upstream \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/tags/*:refs/tags/*'
          requested="${REQUESTED_REF:-${REQUESTED_TAG:-}}"
          ref="${requested:-refs/remotes/upstream/main}"
          if [[ "$ref" =~ ^v[0-9]+([.][0-9]+)+$ ]]; then
            ref="refs/tags/$ref"
          fi
          [[ "$ref" == refs/remotes/upstream/main || "$ref" == refs/tags/v[0-9]* ]] || {
            echo "Invalid upstream ref: $ref" >&2
            exit 2
          }
          git rev-parse --verify "${ref}^{commit}" >/dev/null
          label="${ref#refs/remotes/upstream/}"
          label="${label#refs/tags/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$ref" origin/main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when main already contains the release
        if: steps.release.outputs.needed != 'true'
        run: echo "${{ steps.release.outputs.label }} is already contained in main."

      - name: Generate the pre-merge risk report
        if: steps.release.outputs.needed == 'true'
        run: |
          python3 scripts/upstream_change_report.py \
            --base origin/main \
            --tag '${{ steps.release.outputs.ref }}' \
            --output "$RUNNER_TEMP/upstream-report.md"

      - name: Merge into the managed sync branch
        if: steps.release.outputs.needed == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          ref='${{ steps.release.outputs.ref }}'
          label='${{ steps.release.outputs.label }}'
          branch="upstream-sync/main"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --force-create "$branch" origin/main
          set +e
          git merge --no-ff --no-edit "$ref" >"$RUNNER_TEMP/merge.log" 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            git diff --name-only --diff-filter=U >"$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Record merge conflicts without changing main
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'true'
        shell: bash
        run: |
          set -euo pipefail
          title="Upstream sync conflict: ${{ steps.release.outputs.label }}"
          {
            cat "$RUNNER_TEMP/upstream-report.md"
            printf '\n## Merge conflicts\n\n```text\n'
            cat "$RUNNER_TEMP/conflicts.txt"
            printf '```\n'
          } >"$RUNNER_TEMP/conflict-issue.md"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/conflict-issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/conflict-issue.md"
          fi

      - name: Install the locked test environment
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Run product integration preflight
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        id: product
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev
          source .venv/bin/activate
          python -m pytest -q \
            tests/plugins/test_collaboration_dashboard.py \
            tests/deploy/test_cloud_deployment_assets.py

      - name: Push the verified upstream merge directly to main
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false' && steps.product.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.merge.outputs.branch }}'
          label='${{ steps.release.outputs.label }}'
          git push origin "HEAD:refs/heads/main"
          echo "Verified official Hermes ${label} merge pushed from ${branch}."

      - name: Publish the verified sync branch for diagnostics
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/${{ steps.merge.outputs.branch }}"

      - name: Fail the run when the product preflight failed
        if: steps.release.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false' && steps.product.outcome != 'success'
        run: |
          echo 'Product integration preflight failed; main was not promoted.' >&2
          exit 1
