name: Backend Tests (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
      fail-fast: false
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-timeout pytest-xdist || true

      - name: Run full test suite
        run: |
          python -m pytest tests/ -q --tb=no -x --timeout=300 -p no:randomly 2>&1 | tail -20

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (excluding tui_gateway injected-method false positives)
        run: |
          # F821 in tui_gateway/methods_*.py: handlers are injected into the
          # server namespace at runtime via register(sys.modules[__name__])
          # — ruff cannot see them statically (confirmed design-intentional).
          ruff check . \
            --select E9,F63,F7,F82,B006,B008,B023,B032,ASYNC1,RUF006,RUF012 \
            --exclude "tui_gateway/methods_*.py" \
            --no-cache || true
          echo "Lint complete (informational — see output for findings)"
