name: Backend Tests (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
      fail-fast: false
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify imports
        run: |
          python -c "import hermes_constants; print('core import OK')"
          python -c "import hermes_state; print('state import OK')"

      - name: Run full test suite (parallel runner)
        run: |
          python scripts/run_tests_parallel.py --timeout 300 --verbose

      - name: Run product-chain tests explicitly
        run: |
          python -m pytest tests/hermes_services/test_behavior_eval_product_chain.py -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            test-results.xml
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (high-signal rules)
        run: |
          ruff check . --select E9,F63,F7,F82,B006,B008,B023,B032,ASYNC1,RUF006,RUF012 --no-cache
